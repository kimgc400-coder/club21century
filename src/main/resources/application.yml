spring:
  application:
    name: club21century
  # .env 를 properties 문법으로 읽는다.
  # optional: 이 붙어 있어 파일이 없어도 기동은 되지만,
  # 그 경우 아래 ${DB_USERNAME} 해석에서 실패한다.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: club-pool
      maximum-pool-size: 10

  # MyBatis 에는 ddl-auto 가 없다. 스키마를 만드는 건 오직 Flyway 다.
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  # XML 매퍼를 쓸 경우의 위치. 애노테이션만 쓸 거면 이 줄은 없어도 된다.
  mapper-locations: classpath:mapper/**/*.xml
  # resultType 에 클래스명만 써도 되게 해준다 (FQCN 생략)
  type-aliases-package: com.toyproject.club21century.domain
  configuration:
    # MEMBER_ID -> memberId 자동 변환. 이거 없으면 전 필드가 null 이다.
    map-underscore-to-camel-case: true